<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Dhanya Skills — Animated Skill Solar System</title>
  <desc id="desc">An animated solar-system style visualization of Dhanya's programming, machine learning, data analysis, web development, database, and core computer science skills.</desc>

  <defs>
    <radialGradient id="space" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#17143d"/>
      <stop offset="70%" stop-color="#0a0b2a"/>
      <stop offset="100%" stop-color="#04051a"/>
    </radialGradient>
    <radialGradient id="sun">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="45%" stop-color="#ffd34e"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </radialGradient>
    <linearGradient id="lang" x1="0" x2="1">
      <stop stop-color="#ffd43b"/><stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="ml" x1="0" x2="1">
      <stop stop-color="#ff5c8a"/><stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="data" x1="0" x2="1">
      <stop stop-color="#61f6a4"/><stop offset="1" stop-color="#35d9ff"/>
    </linearGradient>
    <linearGradient id="web" x1="0" x2="1">
      <stop stop-color="#42a5ff"/><stop offset="1" stop-color="#7867ff"/>
    </linearGradient>
    <linearGradient id="db" x1="0" x2="1">
      <stop stop-color="#d08cff"/><stop offset="1" stop-color="#ff75d8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop stop-color="#ffb52e"/><stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#space)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="55" cy="70" r="2"/><circle cx="145" cy="145" r="1.5"/>
    <circle cx="245" cy="55" r="2"/><circle cx="365" cy="115" r="1.5"/>
    <circle cx="520" cy="55" r="2"/><circle cx="690" cy="95" r="1.5"/>
    <circle cx="820" cy="50" r="2"/><circle cx="1010" cy="105" r="1.5"/>
    <circle cx="1130" cy="60" r="2"/><circle cx="1080" cy="330" r="1.5"/>
    <circle cx="1170" cy="560" r="2"/><circle cx="1020" cy="700" r="1.5"/>
    <circle cx="760" cy="750" r="2"/><circle cx="570" cy="690" r="1.5"/>
    <circle cx="350" cy="750" r="2"/><circle cx="130" cy="680" r="1.5"/>
    <circle cx="60" cy="500" r="1.5"/>
  </g>

  <!-- orbit paths -->
  <g fill="none" stroke="#6670c9" stroke-opacity=".35" stroke-width="2">
    <ellipse cx="420" cy="405" rx="165" ry="92"/>
    <ellipse cx="420" cy="405" rx="275" ry="150"/>
    <ellipse cx="420" cy="405" rx="395" ry="220"/>
    <ellipse cx="420" cy="405" rx="535" ry="295"/>
  </g>

  <!-- title -->
  <text x="600" y="48" text-anchor="middle" fill="#f5f7ff"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">
    DHANYA'S SKILL UNIVERSE
  </text>
  <text x="600" y="74" text-anchor="middle" fill="#9da7e8"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    Different Skills • One Goal
  </text>

  <!-- Sun -->
  <g>
    <circle cx="420" cy="405" r="78" fill="#ff9e24" opacity=".25" filter="url(#softGlow)">
      <animate attributeName="r" values="72;84;72" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;.35;.18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="405" r="62" fill="url(#sun)" filter="url(#glow)"/>
    <text x="420" y="398" text-anchor="middle" fill="#35134e"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="900">DHANYA</text>
    <text x="420" y="420" text-anchor="middle" fill="#35134e"
          font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">AI / ML ENGINEER</text>
  </g>

  <!-- Orbiting skill planets -->
  <!-- Languages -->
  <g>
    <circle cx="255" cy="405" r="38" fill="#1a173c" stroke="url(#lang)" stroke-width="3" filter="url(#glow)"/>
    <text x="255" y="412" text-anchor="middle" font-size="25">🐍</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
      <rect x="65" y="235" width="255" height="125" rx="18" fill="#0e1235" stroke="#ffbd32" stroke-width="2"/>
      <text x="85" y="263" fill="#ffd34e" font-size="19" font-weight="800">LANGUAGES</text>
      <text x="85" y="288" font-size="13">Python • C • SQL</text>
      <text x="85" y="310" font-size="13">HTML • CSS</text>
      <text x="85" y="338" fill="#9da7e8" font-size="11">Programming foundations</text>
    </g>
  </g>

  <!-- Machine Learning -->
  <g>
    <circle cx="545" cy="255" r="40" fill="#21152f" stroke="url(#ml)" stroke-width="3" filter="url(#glow)"/>
    <text x="545" y="264" text-anchor="middle" font-size="27">🧠</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="430" y="105" width="270" height="125" rx="18" fill="#0e1235" stroke="#ff5c8a" stroke-width="2"/>
      <text x="450" y="133" fill="#ff6f9a" font-size="18" font-weight="800">MACHINE LEARNING</text>
      <text x="450" y="158" fill="#fff" font-size="13">Scikit-learn • ANN • CNN</text>
      <text x="450" y="180" fill="#fff" font-size="13">ML Fundamentals</text>
      <text x="450" y="207" fill="#9da7e8" font-size="11">Models • training • evaluation</text>
    </g>
  </g>

  <!-- Data Analysis -->
  <g>
    <circle cx="815" cy="260" r="40" fill="#102b2d" stroke="url(#data)" stroke-width="3" filter="url(#glow)"/>
    <text x="815" y="269" text-anchor="middle" font-size="25">📊</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="705" y="110" width="250" height="112" rx="18" fill="#0e1235" stroke="#61f6a4" stroke-width="2"/>
      <text x="725" y="138" fill="#61f6a4" font-size="18" font-weight="800">DATA ANALYSIS</text>
      <text x="725" y="164" fill="#fff" font-size="13">Pandas • NumPy</text>
      <text x="725" y="186" fill="#fff" font-size="13">Matplotlib</text>
      <text x="725" y="208" fill="#9da7e8" font-size="11">Data • visualization • insights</text>
    </g>
  </g>

  <!-- Web Development -->
  <g>
    <circle cx="935" cy="455" r="40" fill="#122340" stroke="url(#web)" stroke-width="3" filter="url(#glow)"/>
    <text x="935" y="464" text-anchor="middle" font-size="24">⚛</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="950" y="330" width="225" height="125" rx="18" fill="#0e1235" stroke="#42a5ff" stroke-width="2"/>
      <text x="970" y="358" fill="#56b0ff" font-size="18" font-weight="800">WEB DEVELOPMENT</text>
      <text x="970" y="384" fill="#fff" font-size="13">React.js • FastAPI</text>
      <text x="970" y="406" fill="#fff" font-size="13">REST APIs</text>
      <text x="970" y="433" fill="#9da7e8" font-size="11">Frontend + backend</text>
    </g>
  </g>

  <!-- Databases -->
  <g>
    <circle cx="815" cy="610" r="40" fill="#241532" stroke="url(#db)" stroke-width="3" filter="url(#glow)"/>
    <text x="815" y="619" text-anchor="middle" font-size="25">🗄️</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="625" y="655" width="265" height="112" rx="18" fill="#0e1235" stroke="#d08cff" stroke-width="2"/>
      <text x="645" y="683" fill="#d99bff" font-size="18" font-weight="800">DATABASES</text>
      <text x="645" y="708" fill="#fff" font-size="13">MySQL • PostgreSQL</text>
      <text x="645" y="730" fill="#fff" font-size="13">MongoDB</text>
      <text x="645" y="752" fill="#9da7e8" font-size="11">SQL + NoSQL</text>
    </g>
  </g>

  <!-- Core CS -->
  <g>
    <circle cx="545" cy="585" r="40" fill="#2a1b25" stroke="url(#core)" stroke-width="3" filter="url(#glow)"/>
    <text x="545" y="594" text-anchor="middle" fill="#fff" font-size="24" font-family="monospace">&lt;/&gt;</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="300" y="650" width="290" height="118" rx="18" fill="#0e1235" stroke="#ff9d35" stroke-width="2"/>
      <text x="320" y="678" fill="#ffad45" font-size="18" font-weight="800">CORE CS</text>
      <text x="320" y="702" fill="#fff" font-size="12.5">DSA • OOP • DBMS</text>
      <text x="320" y="724" fill="#fff" font-size="12.5">Operating Systems</text>
      <text x="320" y="746" fill="#fff" font-size="12.5">Computer Networks</text>
    </g>
  </g>

  <!-- animated orbit particles -->
  <g fill="#fff" filter="url(#glow)">
    <circle r="4">
      <animateMotion dur="7s" repeatCount="indefinite"
        path="M 585,405 A 165,92 0 1 1 254,405 A 165,92 0 1 1 585,405"/>
    </circle>
    <circle r="3">
      <animateMotion dur="11s" repeatCount="indefinite"
        path="M 695,405 A 275,150 0 1 1 145,405 A 275,150 0 1 1 695,405"/>
    </circle>
    <circle r="3">
      <animateMotion dur="15s" repeatCount="indefinite"
        path="M 815,405 A 395,220 0 1 1 25,405 A 395,220 0 1 1 815,405"/>
    </circle>
  </g>

  <!-- gentle planet pulses -->
  <g fill="none" stroke="#fff" opacity=".35">
    <circle cx="255" cy="405" r="47"><animate attributeName="r" values="42;52;42" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.5;.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="255" r="49"><animate attributeName="r" values="44;54;44" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.5;.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="260" r="49"><animate attributeName="r" values="44;54;44" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.5;.1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#737dbb"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">
    PYTHON • AI/ML • DATA • FULL STACK • DATABASES • CORE CS
  </text>
</svg>
